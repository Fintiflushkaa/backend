name: Deploy Core

on:
  push:
    branches:
      - main
  
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test ./apps/core/Feelo/Tests/Tests.csproj
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/core/Feelo
          file: ./apps/core/Feelo/Dockerfile
          push: true
          tags: ghcr.io/fintiflushkaa/feelo-core:latest

      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: 37.230.115.85
          username: root
          key: ${{ secrets.FEELO_GITHUB_ACTIONS }}
          script: |
            cd /opt/feelo
            docker compose pull core
            docker compose up -d
