spring.application.name=calendar-integration-service

server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/feelo_calendar
spring.datasource.username=postgres
spring.datasource.password=wlad2309
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Google OAuth
google.oauth.client-id=${GOOGLE_CLIENT_ID}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET}
google.oauth.redirect-uri=http://localhost:8080/api/oauth/google/callback
google.oauth.scope=https://www.googleapis.com/auth/calendar.events
google.oauth.encryption-key=${GOOGLE_TOKEN_ENCRYPTION_KEY}